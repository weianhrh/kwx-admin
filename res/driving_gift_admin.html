<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>驾驶礼物管理</title>
  <style>
    :root {
      --bg: #f4f7f8;
      --panel: #fff;
      --text: #172126;
      --muted: #6b7d84;
      --line: #dfe8eb;
      --primary: #0f8f8c;
      --primary-dark: #08706e;
      --primary-soft: #e6f6f5;
      --danger: #d94f4b;
      --danger-soft: #fff0ef;
      --success: #15936d;
      --success-soft: #e8f7f1;
      --shadow: 0 10px 28px rgba(30, 55, 66, .07);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-width: 320px;
      padding: 26px 28px 34px;
      color: var(--text);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    button, input, select { font: inherit; }

    .panel {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .panel-title {
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      font-size: 20px;
      font-weight: 900;
    }

    .panel-title::before {
      content: "";
      width: 8px;
      height: 20px;
      border-radius: 999px;
      background: var(--primary);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfd;
    }

    .input, .select {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: 0;
      color: var(--text);
      background: #fff;
      font-size: 13px;
    }

    .input { min-width: 240px; padding: 0 12px; }
    .select { min-width: 130px; padding: 0 32px 0 12px; }

    .input:focus, .select:focus {
      border-color: rgba(15, 143, 140, .52);
      box-shadow: 0 0 0 4px rgba(15, 143, 140, .10);
    }

    .btn {
      min-height: 38px;
      padding: 0 14px;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
    }

    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn-primary { color: #fff; background: var(--primary); }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-ghost { color: var(--text); border-color: var(--line); background: #fff; }
    .btn-ghost:hover { color: var(--primary-dark); border-color: rgba(15,143,140,.35); background: var(--primary-soft); }
    .btn-danger { color: var(--danger); border-color: #f0c7c5; background: #fff; }
    .btn-danger:hover { background: var(--danger-soft); }
    .btn-small { min-height: 32px; padding: 0 10px; }
    .spacer { flex: 1 1 auto; }

    .table-wrap { overflow-x: auto; padding: 0 18px; }

    table { width: 100%; min-width: 980px; border-collapse: collapse; }
    th, td { padding: 13px 10px; border-bottom: 1px solid #e8eff1; text-align: left; vertical-align: middle; }
    th { color: var(--muted); background: #fff; font-size: 12px; font-weight: 900; white-space: nowrap; }
    td { font-size: 13px; }

    .gift-cell { display: flex; align-items: center; gap: 12px; min-width: 250px; }
    .thumb {
      width: 58px;
      height: 58px;
      flex: 0 0 58px;
      object-fit: cover;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f1f5f6;
    }
    .thumb-empty { display: grid; place-items: center; color: #93a4aa; font-size: 11px; }
    .gift-name { margin-bottom: 5px; font-weight: 900; }
    .gift-id, .file-link { color: var(--muted); font-size: 12px; }
    .file-link { display: inline-block; margin-top: 4px; color: var(--primary-dark); text-decoration: none; }
    .preview-link {
      padding: 0;
      border: 0;
      color: var(--primary-dark);
      background: transparent;
      cursor: pointer;
      font-size: 12px;
      font-weight: 800;
    }
    .preview-link:hover { text-decoration: underline; }

    .price { color: var(--primary-dark); font-weight: 900; white-space: nowrap; }
    .tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 68px;
      padding: 4px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .tag-on { color: var(--success); border-color: #b7e5d5; background: var(--success-soft); }
    .tag-off { color: var(--muted); background: #f3f6f7; }
    .switch-summary { display: grid; gap: 5px; color: var(--muted); font-size: 12px; }
    .switch-summary strong { color: var(--text); }
    .actions { display: flex; gap: 7px; justify-content: flex-end; }

    .empty, .loading { padding: 46px 16px; color: var(--muted); text-align: center; }

    .pager {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 18px 18px;
    }
    .pager-info { margin-right: auto; color: var(--muted); font-size: 13px; }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(12, 30, 35, .52);
    }

    .modal.show { display: flex; }

    .modal-card {
      width: min(620px, 100%);
      max-height: calc(100vh - 36px);
      overflow-y: auto;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 24px 70px rgba(9, 35, 42, .23);
    }

    .modal-head {
      display: flex;
      align-items: center;
      padding: 17px 20px;
      border-bottom: 1px solid var(--line);
    }
    .modal-title { margin: 0; font-size: 18px; font-weight: 900; }
    .modal-close { margin-left: auto; padding: 0 4px; border: 0; color: var(--muted); background: none; cursor: pointer; font-size: 27px; }
    .modal-body { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 18px 20px; }
    .field.full { grid-column: 1 / -1; }
    .field label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; font-weight: 900; }
    .field input[type="text"], .field input[type="number"] {
      width: 100%;
      height: 40px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: 0;
    }
    .field input:focus { border-color: rgba(15,143,140,.52); box-shadow: 0 0 0 4px rgba(15,143,140,.10); }

    .upload-row { display: flex; gap: 8px; }
    .upload-row input { min-width: 0; flex: 1 1 auto; }
    .upload-row .btn { flex: 0 0 auto; }
    .hint { margin-top: 6px; color: #8a9ba1; font-size: 11px; line-height: 1.55; }
    .checks { display: flex; flex-wrap: wrap; gap: 10px 18px; }
    .check { display: inline-flex; align-items: center; gap: 7px; color: var(--text); font-size: 13px; font-weight: 700; }
    .check input { width: 17px; height: 17px; accent-color: var(--primary); }
    .modal-foot { display: flex; justify-content: flex-end; gap: 9px; padding: 14px 20px 18px; border-top: 1px solid var(--line); }

    .preview-card { width: min(620px, 100%); }
    .preview-stage {
      position: relative;
      min-height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin: 18px 20px 20px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background:
        linear-gradient(45deg, #edf3f4 25%, transparent 25%),
        linear-gradient(-45deg, #edf3f4 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #edf3f4 75%),
        linear-gradient(-45deg, transparent 75%, #edf3f4 75%);
      background-color: #f9fbfb;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
      background-size: 16px 16px;
    }
    .preview-stage img {
      display: none;
      max-width: 100%;
      max-height: 68vh;
      object-fit: contain;
    }
    #svgaPreviewBox {
      display: none;
      width: 100%;
      height: 420px;
    }
    .preview-message {
      padding: 20px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    .toast {
      position: fixed;
      z-index: 1200;
      left: 50%;
      bottom: 32px;
      transform: translate(-50%, 18px);
      padding: 10px 15px;
      border-radius: 8px;
      color: #fff;
      background: #183339;
      opacity: 0;
      pointer-events: none;
      transition: .18s;
      font-size: 13px;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast.error { background: #a83b38; }

    @media (max-width: 760px) {
      body { padding: 10px; }
      .toolbar { padding: 12px; }
      .toolbar .input, .toolbar .select { width: 100%; min-width: 0; }
      .spacer { display: none; }
      .toolbar .btn { flex: 1 1 auto; }
      .table-wrap { padding: 0 10px; }
      .pager { flex-wrap: wrap; padding: 12px; }
      .pager-info { width: 100%; margin: 0 0 3px; text-align: center; }
      .modal-body { grid-template-columns: 1fr; padding: 15px; }
      .field.full { grid-column: auto; }
      .upload-row { align-items: stretch; flex-direction: column; }
      .preview-stage { min-height: 300px; margin: 12px; }
      #svgaPreviewBox { height: 300px; }
    }
  </style>
</head>
<body>
  <section class="panel">
    <h1 class="panel-title">驾驶礼物管理</h1>

    <div class="toolbar">
      <input class="input" id="keyword" type="search" placeholder="搜索礼物名称或 ID">
      <select class="select" id="displayFilter">
        <option value="">全部状态</option>
        <option value="1">显示中</option>
        <option value="0">已隐藏</option>
      </select>
      <button class="btn btn-ghost" id="searchButton" type="button">查询</button>
      <div class="spacer"></div>
      <button class="btn btn-primary" id="createButton" type="button">+ 添加驾驶礼物</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>礼物</th>
            <th>价格（电池）</th>
            <th>动画资源</th>
            <th>展示配置</th>
            <th>App 展示</th>
            <th style="text-align:right">操作</th>
          </tr>
        </thead>
        <tbody id="giftRows"><tr><td colspan="6" class="loading">正在加载…</td></tr></tbody>
      </table>
    </div>

    <div class="pager">
      <span class="pager-info" id="pagerInfo">第 0/0 页，共 0 条</span>
      <button class="btn btn-ghost" id="prevButton" type="button">上一页</button>
      <button class="btn btn-ghost" id="nextButton" type="button">下一页</button>
      <select class="select" id="pageSize">
        <option value="10">10 / 页</option>
        <option value="20" selected>20 / 页</option>
        <option value="50">50 / 页</option>
      </select>
    </div>
  </section>

  <div class="modal" id="giftModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <div class="modal-head">
        <h2 class="modal-title" id="modalTitle">添加驾驶礼物</h2>
        <button class="modal-close" id="closeButton" type="button" aria-label="关闭">×</button>
      </div>
      <div class="modal-body">
        <input id="giftId" type="hidden">

        <div class="field">
          <label for="giftName">礼物名称</label>
          <input id="giftName" type="text" maxlength="50" placeholder="例如：跑车">
        </div>

        <div class="field">
          <label for="giftPrice">礼物价格（电池）</label>
          <input id="giftPrice" type="number" min="0" max="9999999999" step="1" placeholder="请输入整数">
        </div>

        <div class="field full">
          <label for="imageUrl">礼物图片 image_url</label>
          <div class="upload-row">
            <input id="imageUrl" type="text" maxlength="255" placeholder="上传后自动填入，也可手动填写">
            <button class="btn btn-primary" id="uploadImageButton" type="button">上传图片</button>
          </div>
          <input id="imageFile" type="file" accept="image/*" hidden>
        </div>

        <div class="field full">
          <label for="gifUrl">礼物动画 gif_url</label>
          <div class="upload-row">
            <input id="gifUrl" type="text" maxlength="255" placeholder="上传后自动填入，也可手动填写">
            <button class="btn btn-primary" id="uploadAnimationButton" type="button">上传图片 / SVGA</button>
          </div>
          <input id="animationFile" type="file" accept="image/*,.gif,.svga,application/octet-stream" hidden>
          <div class="hint">上传请求使用 upload_profile.php；成功后读取 url 并自动填入当前输入框。</div>
        </div>

        <div class="field full">
          <label>展示开关</label>
          <div class="checks">
            <label class="check"><input id="isDisplay" type="checkbox">App 显示</label>
            <label class="check"><input id="topBanner" type="checkbox">顶部浮条显示</label>
            <label class="check"><input id="playSvga" type="checkbox">播放 SVGA</label>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" id="cancelButton" type="button">取消</button>
        <button class="btn btn-primary" id="saveButton" type="button">保存</button>
      </div>
    </div>
  </div>

  <div class="modal" id="previewModal" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
    <div class="modal-card preview-card">
      <div class="modal-head">
        <h2 class="modal-title" id="previewTitle">动图预览</h2>
        <button class="modal-close" id="previewCloseButton" type="button" aria-label="关闭">×</button>
      </div>
      <div class="preview-stage">
        <img id="previewImage" alt="动图预览">
        <div id="svgaPreviewBox"></div>
        <div class="preview-message" id="previewMessage">正在加载…</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/svgaplayerweb/build/svga.min.js"></script>
  <script>
    const API_URL = '/api/operat/driving_gift_detail.php';
    const UPLOAD_URL = 'https://app.kwxapp.cn/app/img/userimg/upload_profile.php';
    const SVGA_PROXY_URL = '/api/operat/svga_proxy.php';
    const state = { page: 1, pageSize: 20, total: 0, list: [], loading: false };
    const byId = id => document.getElementById(id);
    let toastTimer = null;
    let svgaPreviewPlayer = null;
    let svgaPreviewParser = null;

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[char]));
    }

    function showToast(message, type = '') {
      const toast = byId('toast');
      toast.textContent = message;
      toast.className = 'toast show' + (type ? ' ' + type : '');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.className = 'toast'; }, 2200);
    }

    async function requestJson(url, options = {}) {
      const response = await fetch(url, { credentials: 'include', ...options });
      const text = await response.text();
      let data;
      try { data = JSON.parse(text); } catch (error) { throw new Error('接口未返回有效 JSON'); }
      if (!response.ok || !data.ok) throw new Error(data.msg || '请求失败');
      return data;
    }

    function queryString(params) {
      const search = new URLSearchParams();
      Object.entries(params).forEach(([key, value]) => {
        if (value !== '' && value !== null && value !== undefined) search.set(key, value);
      });
      return search.toString();
    }

    function imageCell(row) {
      const image = row.image_url
        ? `<img class="thumb" src="${escapeHtml(row.image_url)}" alt="" onerror="this.classList.add('thumb-empty');this.removeAttribute('src');this.alt='加载失败'">`
        : '<div class="thumb thumb-empty">无图片</div>';
      return `<div class="gift-cell">${image}<div><div class="gift-name">${escapeHtml(row.gift_name)}</div><div class="gift-id">ID：${Number(row.id)}</div>${row.image_url ? `<a class="file-link" href="${escapeHtml(row.image_url)}" target="_blank" rel="noopener">查看图片</a>` : ''}</div></div>`;
    }

    function renderRows() {
      const body = byId('giftRows');
      if (!state.list.length) {
        body.innerHTML = '<tr><td colspan="6" class="empty">暂无驾驶礼物</td></tr>';
      } else {
        body.innerHTML = state.list.map(row => {
          const displayOn = Number(row.is_display) === 1;
          const bannerOn = Number(row.is_top_banner_show) === 1;
          const svgaOn = Number(row.is_play_svga) === 1;
          return `<tr>
            <td>${imageCell(row)}</td>
            <td><span class="price">${Number(row.gift_price || 0)}</span></td>
            <td>${row.gif_url ? `<button class="preview-link" data-preview-url="${escapeHtml(row.gif_url)}" data-preview-name="${escapeHtml(row.gift_name || '动图预览')}" type="button">点击播放</button>` : '<span class="gift-id">未配置</span>'}</td>
            <td><div class="switch-summary"><span>顶部浮条：<strong>${bannerOn ? '显示' : '隐藏'}</strong></span><span>SVGA：<strong>${svgaOn ? '播放' : '关闭'}</strong></span></div></td>
            <td><span class="tag ${displayOn ? 'tag-on' : 'tag-off'}" data-toggle="${Number(row.id)}" data-value="${displayOn ? 0 : 1}">${displayOn ? '显示中' : '已隐藏'}</span></td>
            <td><div class="actions"><button class="btn btn-ghost btn-small" data-edit="${Number(row.id)}" type="button">编辑</button><button class="btn btn-danger btn-small" data-delete="${Number(row.id)}" type="button">删除</button></div></td>
          </tr>`;
        }).join('');
      }

      const pages = Math.max(1, Math.ceil(state.total / state.pageSize));
      byId('pagerInfo').textContent = `第 ${state.total ? state.page : 0}/${state.total ? pages : 0} 页，共 ${state.total} 条`;
      byId('prevButton').disabled = state.page <= 1;
      byId('nextButton').disabled = state.page >= pages || state.total === 0;
      bindRowEvents();
    }

    function bindRowEvents() {
      document.querySelectorAll('[data-edit]').forEach(button => {
        button.onclick = () => {
          const id = Number(button.dataset.edit);
          const row = state.list.find(item => Number(item.id) === id);
          if (row) openModal(row);
        };
      });

      document.querySelectorAll('[data-delete]').forEach(button => {
        button.onclick = async () => {
          const id = Number(button.dataset.delete);
          const row = state.list.find(item => Number(item.id) === id);
          if (!confirm(`确定删除驾驶礼物“${row ? row.gift_name : id}”吗？\n已产生订单的礼物建议改为隐藏。`)) return;
          try {
            await postAction('delete', { id });
            showToast('删除成功');
            await loadList();
          } catch (error) { showToast(error.message, 'error'); }
        };
      });

      document.querySelectorAll('[data-toggle]').forEach(tag => {
        tag.onclick = async () => {
          try {
            await postAction('toggle_display', { id: Number(tag.dataset.toggle), is_display: Number(tag.dataset.value) });
            showToast('展示状态已更新');
            await loadList();
          } catch (error) { showToast(error.message, 'error'); }
        };
      });

      document.querySelectorAll('[data-preview-url]').forEach(button => {
        button.onclick = () => openAnimationPreview(
          button.dataset.previewUrl || '',
          button.dataset.previewName || '动图预览'
        );
      });
    }

    function fileExtension(url) {
      try {
        const path = new URL(url, window.location.href).pathname.toLowerCase();
        const index = path.lastIndexOf('.');
        return index >= 0 ? path.slice(index + 1) : '';
      } catch (error) {
        const clean = String(url || '').split('?')[0].split('#')[0].toLowerCase();
        const index = clean.lastIndexOf('.');
        return index >= 0 ? clean.slice(index + 1) : '';
      }
    }

    function resetAnimationPreview() {
      const image = byId('previewImage');
      image.style.display = 'none';
      image.removeAttribute('src');
      image.onerror = null;
      byId('svgaPreviewBox').style.display = 'none';
      byId('previewMessage').style.display = 'block';
      try {
        if (svgaPreviewPlayer) {
          svgaPreviewPlayer.stopAnimation();
          svgaPreviewPlayer.clear();
        }
      } catch (error) {
        console.warn('停止 SVGA 预览失败：', error);
      }
    }

    function showPreviewError(message) {
      byId('previewMessage').textContent = message;
      byId('previewMessage').style.display = 'block';
      byId('svgaPreviewBox').style.display = 'none';
      byId('previewImage').style.display = 'none';
    }

    function ensureSvgaPreviewPlayer() {
      if (!window.SVGA) return false;
      if (!svgaPreviewPlayer) {
        svgaPreviewPlayer = new SVGA.Player('#svgaPreviewBox');
        svgaPreviewParser = new SVGA.Parser('#svgaPreviewBox');
        svgaPreviewPlayer.loops = 0;
        svgaPreviewPlayer.clearsAfterStop = false;
        svgaPreviewPlayer.setContentMode('AspectFit');
      }
      return true;
    }

    function openAnimationPreview(url, giftName) {
      if (!url) return showToast('该礼物未配置动图', 'error');

      resetAnimationPreview();
      byId('previewTitle').textContent = `${giftName} · 动图预览`;
      byId('previewMessage').textContent = '正在加载…';
      byId('previewModal').classList.add('show');

      if (fileExtension(url) === 'svga') {
        if (!ensureSvgaPreviewPlayer()) {
          showPreviewError('SVGA 播放组件加载失败，请刷新后重试');
          return;
        }

        byId('svgaPreviewBox').style.display = 'block';
        const proxyUrl = `${SVGA_PROXY_URL}?url=${encodeURIComponent(url)}`;
        svgaPreviewParser.load(
          proxyUrl,
          videoItem => {
            try {
              byId('previewMessage').style.display = 'none';
              svgaPreviewPlayer.setVideoItem(videoItem);
              svgaPreviewPlayer.startAnimation();
            } catch (error) {
              console.error('SVGA 播放失败：', error);
              showPreviewError('SVGA 播放失败');
            }
          },
          error => {
            console.error('SVGA 加载失败：', error);
            showPreviewError('SVGA 加载失败，请检查代理接口返回');
          }
        );
        return;
      }

      const image = byId('previewImage');
      image.onload = () => {
        byId('previewMessage').style.display = 'none';
        image.style.display = 'block';
      };
      image.onerror = () => showPreviewError('动图加载失败');
      image.src = url;
    }

    function closeAnimationPreview() {
      byId('previewModal').classList.remove('show');
      resetAnimationPreview();
    }

    async function loadList() {
      if (state.loading) return;
      state.loading = true;
      byId('giftRows').innerHTML = '<tr><td colspan="6" class="loading">正在加载…</td></tr>';
      try {
        const query = queryString({
          act: 'list', page: state.page, page_size: state.pageSize,
          q: byId('keyword').value.trim(), is_display: byId('displayFilter').value
        });
        const result = await requestJson(`${API_URL}?${query}`);
        state.list = Array.isArray(result.data.list) ? result.data.list : [];
        state.total = Number(result.data.pagination && result.data.pagination.total || 0);
        const maxPage = Math.max(1, Math.ceil(state.total / state.pageSize));
        if (state.page > maxPage) { state.page = maxPage; state.loading = false; return loadList(); }
        renderRows();
      } catch (error) {
        state.list = [];
        state.total = 0;
        byId('giftRows').innerHTML = `<tr><td colspan="6" class="empty">加载失败：${escapeHtml(error.message)}</td></tr>`;
      } finally { state.loading = false; }
    }

    function openModal(row = null) {
      byId('modalTitle').textContent = row ? '编辑驾驶礼物' : '添加驾驶礼物';
      byId('giftId').value = row ? row.id : '';
      byId('giftName').value = row ? row.gift_name || '' : '';
      byId('giftPrice').value = row ? row.gift_price ?? '' : '';
      byId('imageUrl').value = row ? row.image_url || '' : '';
      byId('gifUrl').value = row ? row.gif_url || '' : '';
      byId('isDisplay').checked = row ? Number(row.is_display) === 1 : true;
      byId('topBanner').checked = row ? Number(row.is_top_banner_show) === 1 : false;
      byId('playSvga').checked = row ? Number(row.is_play_svga) === 1 : false;
      byId('giftModal').classList.add('show');
      setTimeout(() => byId('giftName').focus(), 0);
    }

    function closeModal() { byId('giftModal').classList.remove('show'); }

    async function postAction(action, payload) {
      return requestJson(`${API_URL}?act=${encodeURIComponent(action)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
    }

    async function saveGift() {
      const id = Number(byId('giftId').value || 0);
      const priceValue = byId('giftPrice').value.trim();
      const payload = {
        gift_name: byId('giftName').value.trim(),
        gift_price: priceValue,
        image_url: byId('imageUrl').value.trim(),
        gif_url: byId('gifUrl').value.trim(),
        is_display: byId('isDisplay').checked ? 1 : 0,
        is_top_banner_show: byId('topBanner').checked ? 1 : 0,
        is_play_svga: byId('playSvga').checked ? 1 : 0
      };

      if (!payload.gift_name) return showToast('请输入礼物名称', 'error');
      if (priceValue === '' || !/^\d+$/.test(priceValue)) return showToast('礼物价格必须是整数', 'error');
      if (!payload.image_url) return showToast('请上传或填写礼物图片', 'error');

      const button = byId('saveButton');
      button.disabled = true;
      button.textContent = '保存中…';
      try {
        await postAction(id ? 'update' : 'create', id ? { id, ...payload } : payload);
        closeModal();
        showToast(id ? '保存成功' : '新增成功');
        await loadList();
      } catch (error) { showToast(error.message, 'error'); }
      finally { button.disabled = false; button.textContent = '保存'; }
    }

    async function uploadAndFill(file, inputId, button) {
      if (!file) return;
      const form = new FormData();
      form.append('file', file);
      const oldText = button.textContent;
      button.disabled = true;
      button.textContent = '上传中…';
      try {
        const response = await fetch(UPLOAD_URL, { method: 'POST', body: form });
        const text = await response.text();
        let result;
        try { result = JSON.parse(text); } catch (error) { throw new Error('上传接口未返回有效 JSON'); }
        const imageUrl = String(result.url || '').trim();
        if (!response.ok || Number(result.code) !== 0 || !imageUrl) {
          throw new Error(result.msg || '上传接口未返回 url');
        }
        byId(inputId).value = imageUrl;
        showToast('上传成功，链接已自动填入');
      } catch (error) { showToast(error.message || '上传失败', 'error'); }
      finally { button.disabled = false; button.textContent = oldText; }
    }

    byId('searchButton').onclick = () => { state.page = 1; loadList(); };
    byId('keyword').onkeydown = event => { if (event.key === 'Enter') { state.page = 1; loadList(); } };
    byId('displayFilter').onchange = () => { state.page = 1; loadList(); };
    byId('createButton').onclick = () => openModal();
    byId('closeButton').onclick = closeModal;
    byId('cancelButton').onclick = closeModal;
    byId('saveButton').onclick = saveGift;
    byId('giftModal').onclick = event => { if (event.target === byId('giftModal')) closeModal(); };
    byId('previewCloseButton').onclick = closeAnimationPreview;
    byId('previewModal').onclick = event => { if (event.target === byId('previewModal')) closeAnimationPreview(); };
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        closeModal();
        closeAnimationPreview();
      }
    });

    byId('prevButton').onclick = () => { if (state.page > 1) { state.page -= 1; loadList(); } };
    byId('nextButton').onclick = () => { state.page += 1; loadList(); };
    byId('pageSize').onchange = event => { state.pageSize = Number(event.target.value || 20); state.page = 1; loadList(); };

    byId('uploadImageButton').onclick = () => { byId('imageFile').value = ''; byId('imageFile').click(); };
    byId('imageFile').onchange = event => uploadAndFill(event.target.files[0], 'imageUrl', byId('uploadImageButton'));
    byId('uploadAnimationButton').onclick = () => { byId('animationFile').value = ''; byId('animationFile').click(); };
    byId('animationFile').onchange = event => uploadAndFill(event.target.files[0], 'gifUrl', byId('uploadAnimationButton'));

    loadList();
  </script>
</body>
</html>
