<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>查询提现记录</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"> 
    <style>
:root {
  --page-bg: #f4f7f8;
  --panel: #ffffff;
  --panel-soft: #fbfcfd;
  --text: #172126;
  --muted: #6b7d84;
  --subtle: #8aa0a8;
  --line: #dfe8eb;
  --line-strong: #c9d8dd;
  --primary: #0f8f8c;
  --primary-dark: #08706e;
  --primary-soft: #e6f6f5;
  --success: #20a876;
  --success-soft: #e8f7f1;
  --warning: #ffb84d;
  --warning-soft: #fff5df;
  --danger: #df5b57;
  --danger-soft: #ffefef;
  --blue: #2f7df6;
  --blue-soft: #eef5ff;
  --shadow: 0 12px 34px rgba(30, 55, 66, .08);
  --shadow-sm: 0 8px 22px rgba(30, 55, 66, .07);
  --radius: 8px;
  --transition: all .16s ease;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  min-height: 100%;
}

body {
  min-width: 320px;
  min-height: 100vh;
  padding: 24px 26px 34px;
  color: var(--text);
  background: var(--page-bg);
  display: block;
  overflow-x: hidden;
}

body > canvas,
canvas {
  display: none !important;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  user-select: none;
}

input,
select,
textarea {
  outline: none;
}

.container {
  width: 100%;
  max-width: none;
  margin: 0 auto;
}

.card {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 0;
  padding: 0;
  margin: 0 auto 18px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  box-shadow: var(--shadow);
  transition: none;
}

.card:hover {
  box-shadow: var(--shadow);
}

.card-title {
  min-height: 64px;
  display: flex !important;
  align-items: center !important;
  justify-content: space-between !important;
  gap: 12px;
  margin: 0;
  padding: 16px 18px;
  border-bottom: 1px solid var(--line);
  color: var(--text);
  background: var(--panel);
  font-size: 20px;
  line-height: 1.25;
  font-weight: 900;
  letter-spacing: .01em;
}

.card-title > span,
.card-title:not(:has(span)) {
  display: inline-flex;
  align-items: center;
  gap: 10px;
}

.card-title > span::before,
.card-title:not(:has(span))::before {
  content: "";
  width: 8px;
  height: 20px;
  border-radius: 999px;
  background: var(--primary);
  flex: 0 0 auto;
}

.action-button {
  min-height: 36px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin: 0 8px 0 0;
  padding: 8px 14px;
  border: 1px solid rgba(15, 143, 140, .18);
  border-radius: var(--radius);
  color: #fff;
  background: var(--primary);
  box-shadow: none;
  cursor: pointer;
  font-size: 13px;
  font-weight: 800;
  line-height: 1;
  white-space: nowrap;
  transition: border-color .16s ease, box-shadow .16s ease, background .16s ease, transform .16s ease;
}

.action-button:hover {
  background: var(--primary-dark);
  box-shadow: 0 8px 18px rgba(15, 143, 140, .18);
  transform: translateY(-1px);
}

.card > .action-button {
  align-self: flex-start;
  margin: 16px 18px 0;
}

.record-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin: 0;
  padding: 18px;
}

.record-list > p {
  margin: 18px 0;
  padding: 18px;
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius);
  color: var(--muted);
  background: var(--panel-soft);
  font-size: 14px;
  font-weight: 800;
}

.record-item {
  position: relative;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px 14px;
  margin: 0;
  padding: 16px;
  border: 1px solid var(--line) !important;
  border-radius: var(--radius) !important;
  color: var(--text);
  background: var(--panel-soft) !important;
  box-shadow: none !important;
  font-size: 13px;
  line-height: 1.55;
  transition: border-color .16s ease, box-shadow .16s ease, background .16s ease;
}

.record-item:hover {
  border-color: rgba(15, 143, 140, .30) !important;
  background: #fff !important;
  box-shadow: var(--shadow-sm) !important;
}

.record-item span,
.record-item p {
  display: block;
  min-width: 0;
  margin: 0 !important;
  color: var(--muted) !important;
  font-weight: 700;
  word-break: break-all;
}

.record-item strong {
  color: var(--text);
  font-weight: 900;
}

.record-item .record-title,
.record-item h4 {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 2px !important;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
  color: var(--text) !important;
  font-size: 15px;
  font-weight: 900;
  line-height: 1.35;
}

.record-item .record-title::before,
.record-item h4::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 999px;
  background: var(--primary);
  flex: 0 0 auto;
}

.record-item h4 span,
.record-item h4 strong,
.record-item h4 * {
  color: var(--primary-dark) !important;
  font-weight: 900;
}

.record-item > span[style*="007BFF"],
.record-item span[style*="007BFF"] {
  color: var(--primary-dark) !important;
  font-weight: 900 !important;
  text-shadow: none !important;
}

.record-item .action-button {
  justify-self: start;
  margin-top: 4px;
}

.input-group {
  width: 100%;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin: 0;
  padding: 0 18px 14px;
}

.card-title + .input-group {
  padding-top: 18px;
}

.input-group input,
.input-group select {
  height: 38px;
  min-width: 180px;
  flex: 1 1 210px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: var(--text);
  background: #fff;
  font-size: 13px;
  font-weight: 700;
  transition: border-color .16s ease, box-shadow .16s ease, background .16s ease;
}

.input-group select {
  max-width: 360px;
}

.input-group input:focus,
.input-group select:focus {
  border-color: rgba(15, 143, 140, .48);
  box-shadow: 0 0 0 4px rgba(15, 143, 140, .10);
}

.card > .input-group + .input-group {
  padding-top: 0;
}

.card > .input-group + .action-button {
  align-self: flex-start;
  margin: 2px 18px 0;
}

#query-results {
  padding-top: 18px;
}

.filter-field {
  display: flex;
  flex: 1 1 210px;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
}

.filter-field input {
  width: 100%;
  min-width: 0;
  flex: none;
}

.filter-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  padding: 0 18px;
}

.filter-actions .action-button {
  margin: 0;
}

.secondary-button {
  color: var(--primary-dark);
  background: var(--primary-soft);
}

.secondary-button:hover {
  color: #fff;
}

.query-summary {
  margin: 16px 18px 0;
  color: var(--muted);
  font-size: 13px;
}

@supports not selector(:has(*)) {
  .card-title {
    position: relative;
    padding-left: 34px;
  }

  .card-title::before {
    content: "";
    position: absolute;
    left: 18px;
    top: 50%;
    width: 8px;
    height: 20px;
    border-radius: 999px;
    background: var(--primary);
    transform: translateY(-50%);
  }
}

@media (max-width: 980px) {
  body {
    padding: 18px 16px 28px;
  }

  .record-item {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 640px) {
  body {
    padding: 14px 12px 24px;
  }

  .card-title {
    min-height: auto;
    align-items: flex-start !important;
    flex-direction: column;
    padding: 14px;
    font-size: 18px;
  }

  .card-title .action-button,
  .card-title > button {
    width: 100%;
    margin-left: 0 !important;
  }

  .card > .action-button,
  .card > .input-group + .action-button {
    width: calc(100% - 28px);
    margin: 14px 14px 0;
  }

  .input-group {
    padding: 0 14px 12px;
  }

  .card-title + .input-group {
    padding-top: 14px;
  }

  .input-group input,
  .input-group select {
    min-width: 100%;
    max-width: 100%;
  }

  .record-list {
    padding: 14px;
  }

  .record-item {
    grid-template-columns: 1fr;
    padding: 14px;
  }

  .record-item .action-button {
    width: 100%;
  }
}
    </style>
</head>

<body>

    <div class="container">
        <div class="card">
            <div class="card-title"><span>查询提现记录</span></div>
            <div class="input-group">
                <label class="filter-field" for="start-date">开始日期
                    <input type="date" id="start-date">
                </label>
                <label class="filter-field" for="end-date">结束日期
                    <input type="date" id="end-date">
                </label>
                <label class="filter-field" for="keyword">场地名称 / 提现编号
                    <input type="search" id="keyword" placeholder="输入场地名称或提现编号" autocomplete="off">
                </label>
            </div>
            <div class="filter-actions">
                <button type="button" class="action-button" onclick="queryRecords()">查询</button>
                <button type="button" class="action-button secondary-button" onclick="resetToday()">重置为今日</button>
                <button type="button" class="action-button secondary-button" onclick="queryAllDates()">全部日期</button>
            </div>
            <p id="query-summary" class="query-summary" aria-live="polite">默认查询今日记录，按申请时间从新到旧排列。</p>
            <div id="query-results" class="record-list" aria-live="polite"></div>
        </div>
    </div>

    <script>
        let querySequence = 0;

        function todayInShanghai() {
            const parts = new Intl.DateTimeFormat('en-US', {
                timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit'
            }).formatToParts(new Date());
            const value = type => parts.find(part => part.type === type).value;
            return `${value('year')}-${value('month')}-${value('day')}`;
        }

        function resetToday() {
            const today = todayInShanghai();
            document.getElementById('start-date').value = today;
            document.getElementById('end-date').value = today;
            document.getElementById('keyword').value = '';
            queryRecords();
        }

        function queryAllDates() {
            document.getElementById('start-date').value = '';
            document.getElementById('end-date').value = '';
            queryRecords();
        }

        document.addEventListener('DOMContentLoaded', function () {
            ['start-date', 'end-date', 'keyword'].forEach(id => {
                document.getElementById(id).addEventListener('keydown', event => {
                    if (event.key === 'Enter' && !event.isComposing) {
                        event.preventDefault();
                        queryRecords();
                    }
                });
            });
            resetToday();
        });

        function showQueryMessage(message) {
            const container = document.getElementById('query-results');
            container.textContent = '';
            const paragraph = document.createElement('p');
            paragraph.textContent = message;
            container.appendChild(paragraph);
        }

        function queryRecords() {
            const sequence = ++querySequence;
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;
            const keyword = document.getElementById('keyword').value.trim();
            const summary = document.getElementById('query-summary');
            if (startDate && endDate && startDate > endDate) {
                summary.textContent = '请调整日期范围后查询。';
                showQueryMessage('开始日期不能晚于结束日期');
                return;
            }

            const params = new URLSearchParams({
                all_venues: '1', withdraw_type: 'all',
                start_date: startDate, end_date: endDate, keyword: keyword
            });
            summary.textContent = '正在查询…';
            showQueryMessage('正在加载提现记录…');
            fetch(`/api/pay/getWithdrawalRecords.php?${params.toString()}`)
                .then(response => {
                    if (!response.ok) throw new Error('查询失败，请稍后重试');
                    return response.json();
                })
                .then(data => {
                    if (sequence !== querySequence) return;
                    if (data.code !== 0) throw new Error(data.msg || '查询失败，请稍后重试');
                    const records = Array.isArray(data.data) ? data.data : [];
                    summary.textContent = `共 ${records.length} 条记录，按申请时间从新到旧排列。`;
                    if (records.length) {
                        displayQueryResults(records);
                    } else {
                        showQueryMessage('未找到符合条件的提现记录');
                    }
                })
                .catch(error => {
                    if (sequence !== querySequence) return;
                    summary.textContent = '查询未完成';
                    showQueryMessage(error.message || '查询失败，请稍后重试');
                    console.error('查询失败:', error);
                });
        }

        function displayQueryResults(records) {
            const container = document.getElementById('query-results');
            container.textContent = '';
            const fragment = document.createDocumentFragment();
            records.forEach(record => {
                const item = document.createElement('div');
                item.classList.add('record-item');
                const title = document.createElement('h4');
                title.textContent = `提现编号：${record.id}`;
                item.appendChild(title);
                const status = Number(record.application_status);
                const isGift = record.withdrawal_type === 'gift' || String(record.remarks || '').includes('礼物提现记录');
                const fields = [
                    ['场地名称', `${record.venue_name || '场地已删除或未命名'}（ID：${record.venue_id}）`],
                    ['账户姓名', record.account_name],
                    ['提现类型', isGift ? '礼物提现' : '普通提现'],
                    ['申请时间', record.application_time],
                    ['提现金额', `${record.withdrawal_amount} 元`],
                    ['技术服务费', `${record.technical_service_fee} 元`],
                    ['提现手续费', `${record.withdrawal_fee} 元`],
                    ['实际打款', `${record.actual_amount} 元`],
                    ['打款状态', Number(record.payout_status) === 0 ? '未打款' : '已打款'],
                    ['申请状态', status === 0 ? '待处理' : (status === 1 ? '已处理' : (status === 2 ? '已打款' : (record.reversal_action === 'cancelled' ? '已取消' : '已驳回')))]
                ];
                fields.forEach(([label, value]) => {
                    const paragraph = document.createElement('p');
                    const strong = document.createElement('strong');
                    strong.textContent = `${label}：`;
                    paragraph.appendChild(strong);
                    paragraph.appendChild(document.createTextNode(value == null || value === '' ? '-' : String(value)));
                    item.appendChild(paragraph);
                });
                fragment.appendChild(item);
            });
            container.appendChild(fragment);
        }
    </script>

</body>

</html>
