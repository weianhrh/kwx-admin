<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>绑定收款账号</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
:root {
  --bg: #f4f7f8;
  --panel: #ffffff;
  --panel-soft: #fbfcfd;
  --text: #172126;
  --muted: #6b7d84;
  --line: #dfe8eb;
  --line-strong: #c9d8dd;
  --primary: #0f8f8c;
  --primary-dark: #08706e;
  --primary-soft: #e6f6f5;
  --danger: #df5b57;
  --shadow: 0 12px 34px rgba(30, 55, 66, .08);
  --radius: 8px;
  --transition: all .16s ease;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  min-height: 100%;
}

body {
  min-width: 320px;
  min-height: 100vh;
  padding: 24px 28px 34px;
  color: var(--text);
  background: var(--bg);
  display: block;
  overflow-x: hidden;
}

button,
input,
select,
textarea {
  font: inherit;
}

input,
select,
textarea {
  outline: none;
}

button {
  user-select: none;
}

.container {
  width: 100%;
  max-width: none;
  margin: 0 auto;
}

.card {
  width: 100%;
  margin: 0 auto 18px;
  padding: 0;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  box-shadow: var(--shadow);
}

.card-title {
  min-height: 64px;
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0;
  padding: 16px 18px;
  border-bottom: 1px solid var(--line);
  color: var(--text);
  background: var(--panel);
  font-size: 20px;
  line-height: 1.25;
  font-weight: 900;
  letter-spacing: .01em;
}

.card-title::before {
  content: "";
  width: 8px;
  height: 20px;
  border-radius: 999px;
  background: var(--primary);
  flex: 0 0 auto;
}

.venue-context {
  padding: 16px 18px 0;
  background: var(--panel-soft);
  font-size: 14px;
  line-height: 1.7;
}

.venue-context p {
  margin-top: 5px;
  color: var(--muted);
  font-size: 13px;
}

#bindStatus.is-error {
  color: var(--danger);
}

.field.form-actions {
  flex-direction: row;
  flex-wrap: wrap;
  gap: 10px;
}

.field .secondary-button {
  border-color: var(--line-strong);
  background: var(--panel);
  color: var(--primary-dark);
}

.field .secondary-button:hover {
  border-color: var(--primary);
  background: var(--primary-soft);
}

#bindForm {
  display: grid;
  grid-template-columns: repeat(2, minmax(220px, 1fr));
  gap: 14px;
  padding: 18px;
  background: var(--panel-soft);
}

.field {
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin: 0;
  min-width: 0;
  color: var(--text);
  font-size: 13px;
}

.field label {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.2;
  font-weight: 800;
}

.field input {
  width: 100%;
  min-height: 40px;
  padding: 9px 11px;
  border: 1px solid var(--line-strong);
  border-radius: 7px;
  background: #fff;
  color: var(--text);
  font-size: 13px;
  line-height: 1.5;
  transition: var(--transition);
}

.field input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(15, 143, 140, .12);
}

.field input[readonly],
.field input:disabled {
  background: #f2f6f7;
  color: var(--muted);
  cursor: not-allowed;
}

.field:last-child {
  grid-column: 1 / -1;
  align-items: flex-start;
  padding-top: 2px;
}

.field button {
  min-height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 18px;
  border: 1px solid var(--primary);
  border-radius: 7px;
  background: var(--primary);
  color: #fff;
  font-size: 13px;
  font-weight: 800;
  line-height: 1;
  cursor: pointer;
  transition: var(--transition);
}

.field button:hover {
  border-color: var(--primary-dark);
  background: var(--primary-dark);
}

.field button:disabled {
  border-color: #c7d5da;
  background: #c7d5da;
  color: #fff;
  cursor: not-allowed;
}

@media (max-width: 760px) {
  body {
    padding: 14px;
  }

  .card-title {
    min-height: 56px;
    padding: 14px;
    font-size: 19px;
  }

  #bindForm {
    grid-template-columns: 1fr;
    padding: 14px;
  }

  .field button {
    width: 100%;
  }
}
</style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="card-title">绑定收款账号</div>
      <div class="venue-context">
        <strong id="venueInfo">正在确认当前场地…</strong>
        <p>主场地、子场地分别绑定收款账号，互不替代。绑定后如需更换，请联系平台管理员。</p>
        <p id="bindStatus" role="status">正在读取本场地收款账号，请稍候。</p>
      </div>
      <form id="bindForm">
        <div class="field">
          <label>账号类型</label>
          <input type="text" id="account_type" name="account_type" value="银行卡" readonly>
        </div>
        <div class="field">
          <label>账户姓名</label>
          <input type="text" id="account_name" name="account_name" required>
        </div>
        <div class="field">
          <label>提现卡号</label>
          <input type="text" id="withdrawal_account" name="withdrawal_account" inputmode="numeric" autocomplete="off" required>
        </div>
        <div class="field">
          <label>银行名称</label>
          <input type="text" id="bank_name" name="bank_name" required>
        </div>
        <div class="field">
          <label>银行行号（可选）</label>
          <input type="text" id="bank_number" name="bank_number">
        </div>
        <div class="field">
          <label>备注（可选）</label>
          <input type="text" id="remarks" name="remarks">
        </div>
        <div class="field form-actions">
          <button type="submit" id="submitBtn" disabled>正在加载…</button>
          <button type="button" id="backBtn" class="secondary-button" disabled>返回本场地提现</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('bindForm');
    const submitBtn = document.getElementById('submitBtn');
    const backBtn = document.getElementById('backBtn');
    const venueInfo = document.getElementById('venueInfo');
    const bindStatus = document.getElementById('bindStatus');
    const withdrawalAccountInput = document.getElementById('withdrawal_account');
    const pageParams = new URLSearchParams(window.location.search);
    let targetVenueId = pageParams.has('venue_id') ? pageParams.get('venue_id')
      : (pageParams.has('venueId') ? pageParams.get('venueId') : null);
    let embed = pageParams.get('embed') || '';
    let venueLabel = '';
    let bindingLoaded = false;
    let isBound = false;
    let submitting = false;

    // 兼容已经停留在旧版无参数绑定页的 iframe：从同源 dashboard 的 #venue 恢复场地。
    // URL 已显式传参时不回退，非法场地参数由接口拒绝。
    try {
      if (window.parent !== window && /\/dashboard\.html$/.test(window.parent.location.pathname)) {
        const parentParams = new URLSearchParams(window.parent.location.hash.replace(/^#/, ''));
        if (targetVenueId === null) {
          targetVenueId = parentParams.has('venue') ? parentParams.get('venue')
            : (parentParams.has('venue_id') ? parentParams.get('venue_id') : null);
        }
        if (!embed) embed = 'dashboard';
      }
    } catch (ignore) {
      // 跨域父页面不可读，仍只使用本页参数及后端权限校验。
    }

    function bindingApiUrl() {
      const params = new URLSearchParams();
      if (targetVenueId !== null) params.set('venue_id', targetVenueId);
      const query = params.toString();
      return '/api/pay/BindPaymentAccount.php' + (query ? '?' + query : '');
    }

    function withdrawalPageUrl() {
      const params = new URLSearchParams();
      if (targetVenueId !== null) params.set('venue_id', targetVenueId);
      if (embed) params.set('embed', embed);
      const query = params.toString();
      return 'PaymentDisbursement_optimized.html' + (query ? '?' + query : '');
    }

    function showStatus(message, isError) {
      bindStatus.textContent = message;
      bindStatus.classList.toggle('is-error', !!isError);
    }

    function setFormEnabled(enabled) {
      form.querySelectorAll('input').forEach(el => { el.disabled = !enabled; });
      submitBtn.disabled = !enabled;
    }

    function confirmResponseVenue(data) {
      const resolvedId = Number(data.venue_id);
      if (!Number.isSafeInteger(resolvedId) || resolvedId <= 0 ||
          (targetVenueId !== null && Number(targetVenueId) !== resolvedId)) {
        throw new Error('场地信息不一致，请从提现场地总览重新进入，并确认修复文件已全部替换。');
      }
      return String(resolvedId);
    }

    async function loadBinding() {
      bindingLoaded = false;
      setFormEnabled(false);
      backBtn.disabled = true;
      submitBtn.textContent = '正在加载…';
      try {
        const response = await fetch(bindingApiUrl(), { credentials: 'same-origin', cache: 'no-store' });
        if (!response.ok) throw new Error('收款账号加载失败，请刷新后重试。');
        const data = await response.json();
        if (Number(data.code) !== 0) throw new Error(data.msg || '无法读取本场地收款账号。');
        targetVenueId = confirmResponseVenue(data);
        venueLabel = (data.venue_name || '场地') + '（ID：' + targetVenueId + '）';
        venueInfo.textContent = '当前场地：' + venueLabel;

        // 把后端确认后的场地固定在地址中，刷新、提交及返回时不会切回主场地。
        const currentUrl = new URL(window.location.href);
        currentUrl.searchParams.set('venue_id', targetVenueId);
        if (embed) currentUrl.searchParams.set('embed', embed);
        window.history.replaceState(null, '', currentUrl.href);

        const account = data.data || {};
        ['account_type', 'account_name', 'withdrawal_account', 'bank_name', 'bank_number', 'remarks'].forEach(key => {
          document.getElementById(key).value = account[key] || (key === 'account_type' ? '银行卡' : '');
        });
        isBound = data.is_bound === true;
        bindingLoaded = true;
        backBtn.disabled = false;
        submitBtn.textContent = isBound ? '本场地已绑定' : '提交本场地绑定';
        setFormEnabled(!isBound);
        showStatus(isBound
          ? '本场地已绑定收款账号，不能重复绑定。下方仅显示本场地的收款资料。'
          : '本场地尚未绑定收款账号，请填写下方信息。', false);
      } catch (error) {
        venueInfo.textContent = '场地或收款账号加载失败';
        submitBtn.textContent = '暂不可提交';
        showStatus(error.message || '加载失败，请刷新后重试。', true);
      }
    }

    [withdrawalAccountInput, document.getElementById('bank_number')].forEach(input => {
      input.addEventListener('input', function () {
        this.value = this.value.replace(/\s+/g, '');
      });
    });

    backBtn.addEventListener('click', function () {
      if (bindingLoaded && !submitting) window.location.href = withdrawalPageUrl();
    });

    form.addEventListener('submit', async function (event) {
      event.preventDefault();
      if (!bindingLoaded || isBound || submitting) return;
      withdrawalAccountInput.value = withdrawalAccountInput.value.replace(/\s+/g, '');
      document.getElementById('bank_number').value = document.getElementById('bank_number').value.replace(/\s+/g, '');
      if (!form.reportValidity()) return;
      if (!window.confirm('确认将此收款账号绑定到 ' + venueLabel + '？\n绑定后如需更换，请联系平台管理员。')) return;

      // 必须在禁用输入框前读取表单；禁用后 FormData 不会收集这些输入框。
      const formData = new FormData(form);
      formData.set('venue_id', targetVenueId);
      submitting = true;
      setFormEnabled(false);
      backBtn.disabled = true;
      submitBtn.textContent = '正在绑定…';
      try {
        const response = await fetch(bindingApiUrl(), {
          method: 'POST',
          credentials: 'same-origin',
          cache: 'no-store',
          body: formData
        });
        if (!response.ok) throw new Error('提交失败，请稍后重试。');
        const data = await response.json();
        if (Number(data.code) === 1002) {
          window.alert(data.msg || '本场地已绑定收款账号。');
          await loadBinding();
          return;
        }
        if (Number(data.code) !== 0) throw new Error(data.msg || '绑定失败，请稍后重试。');
        confirmResponseVenue(data);
        isBound = true;
        showStatus('本场地绑定成功，正在返回提现申请。', false);
        window.alert(venueLabel + ' 收款账号绑定成功');
        window.location.replace(withdrawalPageUrl());
      } catch (error) {
        showStatus(error.message || '提交失败，请稍后重试。', true);
      } finally {
        submitting = false;
        setFormEnabled(bindingLoaded && !isBound);
        backBtn.disabled = !bindingLoaded;
        submitBtn.textContent = isBound ? '本场地已绑定' : '提交本场地绑定';
      }
    });

    loadBinding();
  </script>
</body>
</html>
